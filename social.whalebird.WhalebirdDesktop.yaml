app-id: social.whalebird.WhalebirdDesktop
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: start-whalebird.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.gtk.vfs.*
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=com.canonical.indicator.application
  - --talk-name=com.canonical.Unity.LauncherEntry
  - --env=ELECTRON_TRASH=gio
  - --env=FLATPAK_HOST=1
  - --env=GTK_USE_PORTAL=1
modules:
  - name: whalebird
    buildsystem: simple
    build-commands:
      - |
        bsdtar -Oxf whalebird.deb 'data.tar.xz' \
          | bsdtar -xf - --exclude './usr/share/doc'
      - mv "opt/Whalebird" "${FLATPAK_DEST}/Whalebird"
      - install -Dm0644 "${FLATPAK_ID}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm0644 "${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - |
        for size in 44 50 150 256; do
          install -Dm0644 \
            "usr/share/icons/hicolor/${size}x${size}/apps/whalebird.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm0755 start-whalebird.sh "${FLATPAK_DEST}/bin/start-whalebird.sh"
    sources:
      - type: file
        dest-filename: whalebird.deb
        url: https://github.com/h3poteto/whalebird-desktop/releases/download/v6.2.0/Whalebird-6.2.0-linux-amd64.deb
        sha256: 1cfc213d66cb8057329accead432d9b4b2c539e1d7f3e22a6efb2d5ead2e1ede
        only-arches:
          - x86_64
      - type: file
        path: social.whalebird.WhalebirdDesktop.desktop
      - type: file
        path: social.whalebird.WhalebirdDesktop.metainfo.xml
      - type: script
        dest-filename: start-whalebird.sh
        commands:
          - export TMPDIR=$XDG_RUNTIME_DIR/app/$FLATPAK_ID
          - FLATPAK_HOST=1 zypak-wrapper.sh /app/Whalebird/whalebird "$@"
